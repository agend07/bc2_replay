name: Build local replay

on:
  workflow_dispatch:
    inputs:
      bundle_mode:
        description: 'Packaging mode (onedir avoids self-extraction; neither mode is signed)'
        type: choice
        options:
          - onedir
          - onefile
        default: onedir
        required: true
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  builder:
    # The recording builder (Go, stdlib only, offline): vet, tests (the private-data exams skip without their data),
    # and a reproducible builder.exe (built twice, the second time with an empty build cache; the two must be equal).
    runs-on: windows-latest
    env:
      GOPROXY: 'off'
      GOSUMDB: 'off'
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
      GOAMD64: v1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: builder_go/go.mod
          cache: false
      - name: Go vet
        working-directory: builder_go
        run: go vet ./...
      - name: Go tests
        working-directory: builder_go
        run: go test ./...
      - name: Build builder.exe twice and compare
        working-directory: builder_go
        shell: pwsh
        run: |
          $v = (Select-String -Path ../preview_config.py -Pattern "^VERSION = '([^']+)'").Matches[0].Groups[1].Value
          $out = Join-Path $env:RUNNER_TEMP 'builder'
          New-Item -ItemType Directory -Force (Join-Path $out 'a'), (Join-Path $out 'b') | Out-Null
          ./build.ps1 -Version $v -Out (Join-Path $out 'a/builder.exe')
          ./build.ps1 -Version $v -Out (Join-Path $out 'b/builder.exe') -FreshCache
          $a = (Get-FileHash -Algorithm SHA256 (Join-Path $out 'a/builder.exe')).Hash.ToLower()
          $b = (Get-FileHash -Algorithm SHA256 (Join-Path $out 'b/builder.exe')).Hash.ToLower()
          "builder.exe sha256: $a / $b (version $v, $(go version))"
          if ($a -ne $b) { throw "builder.exe is not reproducible: $a vs $b" }
          & (Join-Path $out 'a/builder.exe') version --json
          if ($LASTEXITCODE -ne 0) { throw 'builder.exe version --json failed' }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item (Join-Path $out 'a/builder.exe') dist/builder.exe
          "$a  builder.exe" | Set-Content -Encoding ascii dist/builder.exe.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: bc2-builder-exe
          path: |
            builder_go/dist/builder.exe
            builder_go/dist/builder.exe.sha256
          if-no-files-found: error

  build:
    needs: builder
    runs-on: windows-latest
    env:
      BUNDLE_MODE: ${{ inputs.bundle_mode || 'onedir' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: bc2-builder-exe
          path: dist/builder
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install build dependencies
        working-directory: .
        run: python -m pip install -r requirements-build.txt
      - name: Check source imports and names
        working-directory: .
        run: python -m pyflakes preview.py preview_config.py server_build.py launcher_panel.py backend_lifecycle.py instance_defaults.py release_pack.py replay backend
      - name: Compile sources
        working-directory: .
        run: python -m compileall -q .
      - name: Build proxy dll (MSVC x86, /Brepro)
        shell: cmd
        run: rome_proxy\build_shared.cmd
      - name: Hash proxy dll
        working-directory: rome_proxy/out_shared
        shell: pwsh
        run: |
          $h = (Get-FileHash dinput8.dll -Algorithm SHA256).Hash.ToLower()
          "$h  dinput8.dll" | Set-Content -Encoding ascii dinput8.dll.sha256
          "dinput8.dll sha256: $h"
      - name: Proxy selftests (probe, ring, recorder incl. per-build profiles, chat, dump)
        working-directory: rome_proxy
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'selftest'
          New-Item -ItemType Directory -Force $out | Out-Null
          $fail = @()
          foreach ($t in 'client_probe_selftest', 'bc2_ring_selftest', 'client_recorder_selftest', 'client_chat_selftest', 'client_dump_selftest') {
            "== $t"
            & ".\out_shared\$t.exe" $out
            if ($LASTEXITCODE -ne 0) { $fail += $t }
          }
          if ($fail) { throw "selftests failed: $($fail -join ', ')" }
      - name: Panel unit tests (after the proxy build, test_real_shared reads out_shared\dinput8.dll)
        working-directory: .
        run: python -m unittest discover -s replay -p "test_*.py"
      - uses: actions/upload-artifact@v7
        with:
          name: bc2-proxy-dinput8
          path: |
            rome_proxy/out_shared/dinput8.dll
            rome_proxy/out_shared/dinput8.dll.sha256
          if-no-files-found: error
      - name: Build standalone package (with the builder.exe of the builder job)
        shell: pwsh
        run: ./build.ps1 -BundleMode $env:BUNDLE_MODE -BuilderExe "$env:GITHUB_WORKSPACE/dist/builder/builder.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: bc2-local-replay-windows-${{ env.BUNDLE_MODE }}
          path: |
            dist/${{ env.BUNDLE_MODE }}/bc2-local-replay-standalone.zip
            dist/${{ env.BUNDLE_MODE }}/SHA256.txt
          if-no-files-found: error
      - name: Assemble the full release zip (panel + proxy dll + builder.exe of this run + committed datapack)
        if: env.BUNDLE_MODE == 'onedir'
        shell: pwsh
        run: |
          python release_pack.py --builder-exe "$env:GITHUB_WORKSPACE/dist/builder/builder.exe" --proxy rome_proxy/out_shared/dinput8.dll --out dist/release
          if ($LASTEXITCODE -ne 0) { throw 'release_pack failed' }
          $zip = Get-ChildItem dist/release -Filter 'bc2-local-replay-*.zip' | Select-Object -First 1
          python release_pack.py --check $zip.FullName
          if ($LASTEXITCODE -ne 0) { throw 'release_pack --check failed' }
      - uses: actions/upload-artifact@v7
        if: env.BUNDLE_MODE == 'onedir'
        with:
          name: bc2-local-replay-release
          path: |
            dist/release/bc2-local-replay-*.zip
            dist/release/bc2-local-replay-*.zip.sha256
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: bc2-local-replay-release
          path: release
      - name: Attest build provenance (verify with gh attestation verify <zip> --repo <owner/repo>)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/bc2-local-replay-*.zip
      - name: Create draft prerelease and attach the full release zip
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --draft --prerelease --title "BC2 Local Replay $TAG" --notes "Technical preview. Read USER_GUIDE.md in the ZIP. Requires your own supported game/server files and recordings. Built by this repository's GitHub Actions workflow from the tagged commit (panel, proxy dll, builder, data pack); verify with: gh attestation verify <zip> --repo $GH_REPO. Gameplay and fresh-machine validation are separate." release/bc2-local-replay-*.zip release/bc2-local-replay-*.zip.sha256
